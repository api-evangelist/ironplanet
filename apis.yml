aid: ironplanet
name: IronPlanet
description: 'IronPlanet is an online marketplace for buying and selling used heavy construction equipment
  and trucks across categories including construction, trucks, agriculture, mining, forestry, and oil and
  gas. The platform offers online auctions, buy-now listings, make-an-offer, sealed auctions, and on-site
  auctions, with detailed third-party inspection reports backed by its IronClad Assurance certification
  program. IronPlanet operates regional marketplaces for North America, Europe/Middle East, and Asia-Pacific
  and is part of the Ritchie Bros. (RB Global) family of businesses. This company was surfaced as a
  portfolio company of accel and kleiner-perkins and added to the API Evangelist network for enrichment;
  no public developer API surface was found during enrichment.'
